apiVersion: template.openshift.io/v1
kind: Template
parameters:
  ### Required - do not hard code
  - name: CLUSTER
    description: Cluster this relay serves, e.g. silver, gold, emerald
    required: true

  ### Recommended - suggest hard coding
  - name: APP
    description: Application/component name
    value: oc-relay
  - name: IMAGE
    description: Reverse proxy image; UBI runs as an arbitrary OpenShift UID
    value: registry.access.redhat.com/ubi9/nginx-124:latest

objects:
  - kind: ConfigMap
    apiVersion: v1
    metadata:
      name: ${APP}
      labels:
        app: ${APP}
    data:
      # Pass the caller's Authorization header straight through; the relay holds no
      # credentials of its own and only ever talks to its own in-cluster API.
      nginx.conf: |
        worker_processes auto;
        error_log /dev/stderr warn;
        pid /tmp/nginx.pid;
        events {
          worker_connections 1024;
        }
        http {
          access_log off;
          client_body_temp_path /tmp/client_body;
          proxy_temp_path /tmp/proxy;
          fastcgi_temp_path /tmp/fastcgi;
          uwsgi_temp_path /tmp/uwsgi;
          scgi_temp_path /tmp/scgi;

          map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
          }

          server {
            listen 8080;

            location = /healthz-relay {
              return 200 "ok\n";
            }

            location / {
              proxy_pass https://kubernetes.default.svc:443;
              proxy_ssl_trusted_certificate /var/run/secrets/kubernetes.io/serviceaccount/ca.crt;
              proxy_ssl_verify on;
              proxy_ssl_name kubernetes.default.svc;
              proxy_set_header Host kubernetes.default.svc;

              # oc logs --follow and oc exec need upgrades and unbuffered streaming
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_buffering off;
              proxy_request_buffering off;
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
            }
          }
        }

  - kind: Deployment
    apiVersion: apps/v1
    metadata:
      name: ${APP}
      labels:
        app: ${APP}
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: ${APP}
      template:
        metadata:
          labels:
            app: ${APP}
        spec:
          containers:
            - name: ${APP}
              image: ${IMAGE}
              command: ["nginx", "-c", "/etc/nginx-relay/nginx.conf", "-g", "daemon off;"]
              ports:
                - containerPort: 8080
              readinessProbe:
                httpGet:
                  path: /healthz-relay
                  port: 8080
              livenessProbe:
                httpGet:
                  path: /healthz-relay
                  port: 8080
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: config
                  mountPath: /etc/nginx-relay
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: ${APP}
            - name: tmp
              emptyDir: {}

  - kind: Service
    apiVersion: v1
    metadata:
      name: ${APP}
      labels:
        app: ${APP}
    spec:
      selector:
        app: ${APP}
      ports:
        - port: 8080
          targetPort: 8080

  - kind: Route
    apiVersion: route.openshift.io/v1
    metadata:
      name: ${APP}
      labels:
        app: ${APP}
    spec:
      host: ${APP}.apps.${CLUSTER}.devops.gov.bc.ca
      to:
        kind: Service
        name: ${APP}
      port:
        targetPort: 8080
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
