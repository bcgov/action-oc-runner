name: PR

on:
  pull_request:

concurrency:
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  whoami:
    name: Test Command
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: whoami
        uses: ./
        with:
          commands: |
            oc whoami
            echo "whoami-output-ok" >> "$GITHUB_OUTPUT"
          oc_namespace: ${{ vars.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          oc_version: 4.16
          timeout: 1m
          triggers: ('.github/' 'action.yml')

      - if: steps.whoami.outputs.triggered != 'false'
        run: |
          # Verify outputs
          echo "Outputs: ${{ toJSON(steps.whoami.outputs) }}"
          if [ "${{ steps.whoami.outputs.triggered }}" != "true" ]; then
            echo "Error!  Verify outputs."
            exit 1
          fi
          if [ "${{ steps.whoami.outputs.commands }}" != "whoami-output-ok" ]; then
            echo "Error! Generic commands output did not match expected value."
            exit 1
          fi

  proxy:
    name: Test CONNECT Proxy Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/should_use_proxy_test.sh
      - run: bash proxy/proxy_test.sh

  proxy-e2e:
    name: Test Fallback Through Proxy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run the proxy on this runner
        run: |
          set -euo pipefail
          # Only the cluster this workflow logs into may be tunnelled to
          API_HOST=$(echo "${{ vars.oc_server }}" | sed -E 's#^https://##; s#:[0-9]+$##')
          API_IP=$(getent hosts "${API_HOST}" | awk '{print $1; exit}')
          echo "Proxy will allow: ${API_HOST} (${API_IP})"
          echo "API_HOST=${API_HOST}" >> "${GITHUB_ENV}"
          echo "API_IP=${API_IP}" >> "${GITHUB_ENV}"

          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout tls.key -out tls.crt -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost" 2>/dev/null
          sudo install -d -m 0755 /etc/oc-runner-tls
          sudo install -m 0644 tls.crt tls.key /etc/oc-runner-tls/
          # oc and curl verify the proxy against the system trust store
          sudo install -m 0644 tls.crt /usr/local/share/ca-certificates/oc-runner.crt
          sudo update-ca-certificates

          podman build -q -t oc-runner:ci proxy
          # Started before the runner's DNS is poisoned, and pinned to the real
          # address, so the proxy keeps a working route to the cluster
          podman run -d --name oc-runner -p 3129:3129 \
            --add-host "${API_HOST}:${API_IP}" \
            -e API_HOSTS="${API_HOST}" \
            -v /etc/oc-runner-tls:/etc/squid/tls:ro \
            oc-runner:ci

          for _ in $(seq 1 40); do
            (exec 3<>/dev/tcp/127.0.0.1/3129) 2>/dev/null && break
            sleep 0.5
          done
          (exec 3<>/dev/tcp/127.0.0.1/3129) 2>/dev/null \
            || { podman logs oc-runner; echo "::error::proxy did not start"; exit 1; }

      # The action tries direct first, so make the direct route fail the way a
      # blocked runner does. 192.0.2.1 is TEST-NET-1 and goes nowhere. Only the
      # runner is affected; the container has its own hosts file and DNS, so the
      # proxy is now the single working route to the cluster.
      - name: Blackhole the cluster from the runner only
        run: |
          set -euo pipefail
          echo "192.0.2.1 ${API_HOST}" | sudo tee -a /etc/hosts > /dev/null
          echo "Runner now resolves ${API_HOST} to $(getent hosts "${API_HOST}" | awk '{print $1; exit}')"
          echo "Proxy still resolves it to $(podman exec oc-runner getent hosts "${API_HOST}" | awk '{print $1; exit}')"

      # A successful login now proves the fallback engaged: there is no other route.
      - uses: ./
        with:
          oc_namespace: ${{ vars.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          oc_proxy: https://localhost:3129
          commands: oc whoami
          timeout: 1m

      - name: Confirm the traffic actually went through the proxy
        run: |
          set -euo pipefail
          # Read the log once; 'grep -q' in a pipeline would SIGPIPE podman and trip pipefail
          podman logs oc-runner > proxy.log 2>&1
          grep TCP_ proxy.log || true
          grep -q "TCP_TUNNEL.*${GITHUB_REPOSITORY}" proxy.log \
            || { echo "::error::No tunnel logged for ${GITHUB_REPOSITORY}; traffic bypassed the proxy."; exit 1; }
          echo "Direct route was black-holed, so login could only have succeeded via the proxy."

  repository:
    name: Test Non-Default Repository
    needs: whoami
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - id: repository
        uses: ./
        with:
          commands: |
            git remote -v
            if ! git config --get remote.origin.url | grep -q "bcgov/quickstart-openshift"; then
              echo "Error! Repository bcgov/quickstart-openshift is not checked out."
              exit 1
            else
              echo "Repository URL: $(git config --get remote.origin.url)"
              echo "Current Branch: $(git branch --show-current)"
            fi
          oc_namespace: ${{ vars.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          repository: bcgov/quickstart-openshift
          ref: ''
          timeout: 1m
          triggers: ('.github/' 'action.yml')

      - if: steps.repository.outputs.triggered != 'false'
        run: |
          # Verify outputs
          echo "Outputs: ${{ toJSON(steps.repository.outputs) }}"
          if [ "${{ steps.repository.outputs.triggered }}" != "true" ]; then
            echo "Error!  Verify outputs."
            exit 1
          fi

  legacy:
    name: Test Legacy Binary
    needs: repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          commands: oc version
          oc_namespace: ${{ vars.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          oc_version: '4.1'
          timeout: 1m
          triggers: ('.github/' 'action.yml')

  cronjob:
    name: Test CronJob
    needs: legacy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: cronjob
        uses: ./
        with:
          commands: oc process -f cronjob/openshift.deploy.yml -p ZONE=${{ github.event.number }} | oc apply -f -
          cronjob: ${{ github.event.repository.name }}-${{ github.event.number }}-cronjob
          cronjob_tail: -1
          oc_namespace: ${{ vars.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          timeout: 1m
          triggers: ('.github/' 'action.yml' 'cronjob/' 'scripts/run_cronjob.sh')

      - if: steps.cronjob.outputs.triggered != 'false'
        run: |
          # Verify outputs
          echo "Outputs: ${{ toJSON(steps.cronjob.outputs) }}"
          if [ "${{ steps.cronjob.outputs.job-name }}" == "" ]; then
            echo "Error!  Verify outputs."
            exit 1
          fi

  test-failures:
    name: Test Failure Scenarios
    needs: cronjob
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # 1. Test wrong server (should retry and fail)
      - id: test-wrong-server
        uses: ./
        continue-on-error: true
        with:
          commands: oc whoami
          oc_namespace: ${{ vars.oc_namespace }}
          oc_server: https://api.nonexistent.devops.gov.bc.ca:6443
          oc_token: ${{ secrets.oc_token }}
          login_attempts: 2
          timeout: 1m
          triggers: ('.github/' 'action.yml')

      - name: Verify wrong server outcome
        if: steps.test-wrong-server.outputs.triggered != 'false'
        run: |
          echo "Wrong server step outcome: ${{ steps.test-wrong-server.outcome }}"
          if [ "${{ steps.test-wrong-server.outcome }}" != "failure" ]; then
            echo "Error: Wrong server step did not fail as expected."
            exit 1
          fi

      # 2. Test wrong token (should fail fast)
      - id: test-wrong-token
        uses: ./
        continue-on-error: true
        with:
          commands: oc whoami
          oc_namespace: ${{ vars.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: invalidtokeninvalidtokeninvalidtokeninvalidtoken
          login_attempts: 3
          timeout: 1m
          triggers: ('.github/' 'action.yml')

      - name: Verify wrong token outcome
        if: steps.test-wrong-token.outputs.triggered != 'false'
        run: |
          echo "Wrong token step outcome: ${{ steps.test-wrong-token.outcome }}"
          if [ "${{ steps.test-wrong-token.outcome }}" != "failure" ]; then
            echo "Error: Wrong token step did not fail as expected."
            exit 1
          fi

  # ==========================================================================
  # WARNING: This job acts as the required merge gate for this workflow.
  # If you add a new job to this workflow, you MUST add its ID to the 'needs'
  # array below, otherwise its failure or cancellation will not block the PR!
  # ==========================================================================
  results:
    name: PR Results
    needs: [whoami, proxy, proxy-e2e, repository, legacy, cronjob, test-failures]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Log Job Results Context
        run: |
          echo "=== Upstream Job Statuses ==="
          echo '${{ toJson(needs) }}'

      - name: Evaluate Overall Status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "❌ Critical Check Failure: At least one required job has failed or was cancelled."
          exit 1

      - name: Success Message
        run: echo "✅ All critical checks passed or were intentionally skipped!"
