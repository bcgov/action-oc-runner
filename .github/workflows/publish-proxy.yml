name: Publish Proxy Image

on:
  push:
    branches: [main]
    paths:
      - proxy/**
      - .github/workflows/publish-proxy.yml
  workflow_dispatch:

concurrency:
  group: publish-proxy
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/oc-connect-proxy
    steps:
      - uses: actions/checkout@v7

      # Never publish an image whose access gate is broken
      - name: Verify the gate before publishing
        run: bash proxy/proxy_test.sh

      - name: Build and push
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Registries require a lowercase path
          NAME="${IMAGE,,}"

          podman build -t "${NAME}:${GITHUB_SHA}" -t "${NAME}:latest" proxy
          printf '%s' "${REGISTRY_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          podman push "${NAME}:${GITHUB_SHA}"
          podman push "${NAME}:latest"

          echo "Published ${NAME}:${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
